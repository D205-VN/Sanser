# LiveKit 1.13.11. Keys are supplied by the separate --key-file argument.
# HTTP/signaling remains private; rtc media sockets are configured separately.
port: 7880
bind_addresses: [127.0.0.1]
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true
logging:
  level: warn
  pion_level: error

# Restricted Wi-Fi may also require TURN/TLS on TCP 443 on a separate IP/L4
# endpoint. Do not point TURN at the HTTPS reverse proxy or expose SFU signaling.
# See README.md before enabling any external deployment.
