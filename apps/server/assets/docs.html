<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanser API</title>
<style>
:root{--bg:#0f1115;--surface:#171a21;--raised:#1f232c;--border:#2b313c;--strong:#5a6577;--text:#f4f6fa;--soft:#d8dde6;--muted:#aab3c2;--accent:#8ab4ff;--violet:#b59cff;--ok:#5fd9a8;--warn:#f3c66e;--bad:#ff8f9c;font-family:Inter,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
*{box-sizing:border-box}body{margin:0;line-height:1.5}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--border);background:#0f1115f2}
h1{margin:0;font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
header small{color:var(--muted);font-size:13px}
header .spacer{flex:1}
main{max-width:1040px;margin:0 auto;padding:24px 16px 80px}
p.lead{color:var(--muted);margin:0 0 20px}
input,textarea,button,select{font:inherit;color:inherit}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--strong);border-radius:10px;background:var(--raised)}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:13px;resize:vertical}
button{min-height:40px;padding:0 16px;border:1px solid var(--strong);border-radius:10px;background:var(--raised);font-weight:600;cursor:pointer}
button:hover{background:#2a2f3a}
button.primary{border:0;color:#0a1a33;background:linear-gradient(135deg,var(--accent),var(--violet))}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#token{width:min(340px,60vw)}
section>h2{margin:32px 0 12px;font-size:18px}
details.op{margin:8px 0;border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden}
details.op>summary{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;list-style:none}
details.op>summary::-webkit-details-marker{display:none}
.method{flex:0 0 68px;padding:4px 0;border-radius:8px;text-align:center;font-size:12px;font-weight:800;letter-spacing:.04em;color:#0f1115}
.get{background:var(--accent)}.post{background:var(--ok)}.patch{background:var(--warn)}.delete{background:var(--bad)}.ws{background:var(--violet)}
.path{font-family:ui-monospace,Menlo,monospace;font-size:14px;overflow-wrap:anywhere}
.sum{margin-left:auto;color:var(--muted);font-size:13px;text-align:right}
.lock{font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:1px 8px;white-space:nowrap}
.body{padding:4px 14px 16px;border-top:1px solid var(--border)}
.body h3{margin:16px 0 6px;font-size:13px;color:var(--soft)}
.row{display:grid;grid-template-columns:170px 1fr;gap:10px;align-items:center;margin:6px 0}
.row label{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.row label i{color:var(--bad);font-style:normal}
.codes{display:flex;flex-wrap:wrap;gap:6px}
.codes span{padding:2px 8px;border:1px solid var(--border);border-radius:999px;font-size:12px;color:var(--soft)}
pre{margin:8px 0 0;padding:12px;border:1px solid var(--border);border-radius:10px;background:#0b0d11;font-size:13px;overflow:auto;max-height:420px;white-space:pre-wrap;overflow-wrap:anywhere}
.status{margin-top:12px;font-weight:700}.status.good{color:var(--ok)}.status.fail{color:var(--bad)}
.note{color:var(--muted);font-size:13px}
@media(max-width:640px){.row{grid-template-columns:1fr}.sum{display:none}}
</style>
</head>
<body>
<header>
  <h1>Sanser API</h1><small id="version"></small><span class="spacer"></span>
  <label for="token" class="note">Bearer token</label>
  <input id="token" type="password" autocomplete="off" placeholder="accessToken from /auth/login">
  <a class="note" href="/api/openapi.json">openapi.json</a>
</header>
<main>
  <p class="lead" id="lead">Loading…</p>
  <div id="groups"></div>
  <section><h2>Schemas</h2><div id="schemas"></div></section>
</main>
<script>
'use strict';
const el=(tag,props={},...kids)=>{const n=document.createElement(tag);for(const[k,v]of Object.entries(props)){if(k==='class')n.className=v;else if(k==='text')n.textContent=v;else n.setAttribute(k,v);}for(const k of kids)n.append(k);return n;};
const token=document.getElementById('token');
let spec;
const resolve=s=>s&&s.$ref?spec.components.schemas[s.$ref.split('/').pop()]:s;
function example(schema,depth=0){
  const s=resolve(schema);if(!s||depth>4)return null;
  if(s.enum)return s.enum[0];
  if(s.type==='object'){const o={};for(const[k,v]of Object.entries(s.properties||{})){if((s.required||[]).includes(k))o[k]=example(v,depth+1);}return o;}
  if(s.type==='array')return[];
  if(s.type==='boolean')return false;
  if(s.type==='integer')return 0;
  return s.format==='uuid'?'00000000-0000-4000-8000-000000000000':'';
}
function operation(path,method,op){
  const ws=op['x-websocket'];
  const d=el('details',{class:'op'});
  const secured=(op.security||[]).length>0;
  d.append(el('summary',{},el('span',{class:'method '+(ws?'ws':method),text:ws?'WS':method.toUpperCase()}),el('span',{class:'path',text:path}),secured?el('span',{class:'lock',text:'auth'}):'',el('span',{class:'sum',text:op.summary||''})));
  const body=el('div',{class:'body'});d.append(body);
  if(op.description)body.append(el('p',{class:'note',text:op.description}));
  const inputs={};
  if((op.parameters||[]).length){body.append(el('h3',{text:'Parameters'}));
    for(const p of op.parameters){const id=`${op.operationId}-${p.name}`;const input=el('input',{id,placeholder:p.in});inputs[p.name]={input,where:p.in,required:p.required};
      const label=el('label',{for:id,text:p.name});if(p.required)label.append(el('i',{text:' *'}));body.append(el('div',{class:'row'},label,input));}}
  let area;
  const schema=op.requestBody&&op.requestBody.content['application/json'].schema;
  if(schema){body.append(el('h3',{text:'Request body — '+(schema.$ref||'').split('/').pop()}));area=el('textarea',{spellcheck:'false','aria-label':'Request body'});area.value=JSON.stringify(example(schema),null,2);body.append(area);}
  body.append(el('h3',{text:'Responses'}));
  const codes=el('div',{class:'codes'});for(const[c,r]of Object.entries(op.responses))codes.append(el('span',{text:`${c} ${r.description}`}));body.append(codes);
  if(ws)return d;
  const run=el('button',{class:'primary',type:'button',text:'Send request'});
  const status=el('div',{class:'status',role:'status'});const out=el('pre',{hidden:''});
  body.append(el('h3',{text:'Try it'}),run,status,out);
  run.addEventListener('click',async()=>{
    let url=path;const query=new URLSearchParams();
    for(const[name,{input,where,required}]of Object.entries(inputs)){const v=input.value.trim();
      if(!v&&required){status.className='status fail';status.textContent=`${name} is required`;input.focus();return;}
      if(where==='path')url=url.replace(`{${name}}`,encodeURIComponent(v));else if(v)query.set(name,v);}
    if([...query].length)url+='?'+query;
    const headers={Accept:'application/json'};let payload;
    if(area){try{payload=JSON.stringify(JSON.parse(area.value));}catch{status.className='status fail';status.textContent='Request body is not valid JSON';return;}headers['Content-Type']='application/json';}
    if(secured&&token.value.trim())headers.Authorization='Bearer '+token.value.trim();
    run.disabled=true;status.className='status';status.textContent='Sending…';
    try{
      const started=performance.now();
      const response=await fetch(url,{method:method.toUpperCase(),headers,body:payload,cache:'no-store',credentials:'omit'});
      const text=await response.text();let shown=text,parsed;
      try{parsed=JSON.parse(text);shown=JSON.stringify(parsed,null,2);}catch{}
      status.className='status '+(response.ok?'good':'fail');
      status.textContent=`${response.status} ${response.statusText} · ${Math.round(performance.now()-started)} ms`;
      out.hidden=false;out.textContent=shown||'(empty body)';
      if(response.ok&&parsed&&typeof parsed.accessToken==='string'){token.value=parsed.accessToken;status.textContent+=' · token filled in above';}
    }catch(error){status.className='status fail';status.textContent='Request failed: '+error.message;}
    finally{run.disabled=false;}
  });
  return d;
}
(async()=>{
  const lead=document.getElementById('lead');
  try{spec=await(await fetch('/api/openapi.json',{cache:'no-store'})).json();}
  catch{lead.textContent='Unable to load /api/openapi.json';return;}
  lead.textContent=spec.info.description+' The token you paste stays in this tab only; requests go to this server.';
  document.getElementById('version').textContent='v'+spec.info.version;
  const groups=document.getElementById('groups');
  for(const tag of spec.tags){
    const section=el('section',{},el('h2',{text:tag.name}));let any=false;
    for(const[path,methods]of Object.entries(spec.paths))for(const[method,op]of Object.entries(methods))
      if((op.tags||[]).includes(tag.name)){section.append(operation(path,method,op));any=true;}
    if(any)groups.append(section);
  }
  const schemas=document.getElementById('schemas');
  for(const[name,schema]of Object.entries(spec.components.schemas)){
    const d=el('details',{class:'op'},el('summary',{},el('span',{class:'path',text:name})));
    const lines=Object.entries(schema.properties||{}).map(([k,v])=>`${k}${(schema.required||[]).includes(k)?' *':''}: ${v.$ref?v.$ref.split('/').pop():v.enum?v.enum.join(' | '):v.type==='array'?(v.items.$ref?v.items.$ref.split('/').pop():v.items.type)+'[]':v.type+(v.format?` (${v.format})`:'')}`);
    d.append(el('div',{class:'body'},el('pre',{text:lines.join('\n')||'object'})));schemas.append(d);
  }
})();
</script>
</body>
</html>
