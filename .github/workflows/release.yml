name: Release Sanser 2.3.8

on:
  push:
    tags: ["v2.3.8"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SANSER_VERSION: 2.3.8
  VITE_SANSER_SERVER_URL: ${{ vars.SANSER_API_URL }}

jobs:
  source-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-repository.sh

  windows-x64:
    needs: source-policy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:validate
      - name: Prepare verified Windows installer tools
        shell: pwsh
        run: ./scripts/prepare-windows-nsis.ps1
      - run: npm run desktop:stage-sidecar
        env:
          SANSER_TARGET_TRIPLE: x86_64-pc-windows-msvc
      - name: Reject incomplete native protocol on a production tag
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $capabilities = (& apps/desktop/src-tauri/binaries/sanser-host-windows-x86_64-pc-windows-msvc.exe --capabilities-json) | ConvertFrom-Json
          if ($capabilities.nativeSnv2 -ne $true) { throw 'nativeSnv2 is not release-ready' }
          if ($capabilities.version -ne $env:SANSER_VERSION) { throw 'Windows host version does not match the release' }
          $viewer = (& apps/desktop/src-tauri/binaries/sanser-client-windows-x86_64-pc-windows-msvc.exe --capabilities-json) | ConvertFrom-Json
          if ($viewer.version -ne $env:SANSER_VERSION) { throw 'Windows viewer version does not match the release' }
          if ($viewer.snv2AudioImplementation -ne $true) { throw 'Windows SNV2 audio playback is missing' }
          if ($capabilities.groupVoiceImplementation -ne $true -or $viewer.groupVoiceImplementation -ne $true) { throw 'Windows group voice is missing' }
          if ($capabilities.groupVoiceFloatingControls -ne $true -or $viewer.groupVoiceFloatingControls -ne $true) { throw 'Windows floating voice controls are missing' }
          if ($capabilities.externalVoiceGate -ne $true -or $viewer.externalVoiceGate -ne $true) { throw 'Windows external voice handoff is missing' }
      - name: Build Tauri application
        run: npm --workspace @sanser/desktop run tauri -- build --target x86_64-pc-windows-msvc
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Name artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $setup = Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw 'NSIS installer was not produced' }
          $setupSignature = "$($setup.FullName).sig"
          if (-not (Test-Path $setupSignature)) { throw 'Signed NSIS updater artifact was not produced' }
          Copy-Item $setup.FullName artifacts/Sanser-Windows-2.3.8-x64-setup.exe
          Copy-Item $setupSignature artifacts/Sanser-Windows-2.3.8-x64-setup.exe.sig
          
          New-Item -ItemType Directory -Force build/portable | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/sanser.exe build/portable/sanser.exe
          Copy-Item apps/desktop/src-tauri/binaries/sanser-host-windows-x86_64-pc-windows-msvc.exe build/portable/sanser-host-windows.exe
          Copy-Item apps/desktop/src-tauri/binaries/sanser-client-windows-x86_64-pc-windows-msvc.exe build/portable/sanser-client-windows.exe
          Copy-Item apps/desktop/src-tauri/binaries/sanser-uac-service-x86_64-pc-windows-msvc.exe build/portable/sanser-uac-service.exe
          New-Item -ItemType Directory -Force build/portable/licenses | Out-Null
          Copy-Item apps/desktop/src-tauri/licenses/opus.txt build/portable/licenses/opus.txt
          Copy-Item apps/desktop/src-tauri/licenses/speexdsp.txt build/portable/licenses/speexdsp.txt
          Copy-Item apps/desktop/src-tauri/licenses/livekit-client.txt build/portable/licenses/livekit-client.txt
          7z a -t7z -mx=9 build/sanser-portable.7z ./build/portable/*
          @'
          ;!@Install@!UTF-8!
          Title="Sanser 2.3.8 Portable"
          RunProgram="sanser.exe"
          GUIMode="2"
          ;!@InstallEnd@!
          '@ | Set-Content -NoNewline -Encoding utf8 build/sfx-config.txt
          $sfx = Join-Path $env:ProgramFiles '7-Zip/7z.sfx'
          cmd /c copy /b `"$sfx`"+build\sfx-config.txt+build\sanser-portable.7z `"artifacts\Sanser-Windows-2.3.8-x64-portable.exe`"
      - uses: actions/upload-artifact@v4
        with:
          name: sanser-windows-2.3.8-x64
          path: artifacts/*
          if-no-files-found: error

  macos-arm64:
    needs: source-policy
    runs-on: macos-15
    env:
      SANSER_TARGET_TRIPLE: aarch64-apple-darwin
      CARGO_TARGET_DIR: /tmp/sanser-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:validate
      - run: npm run desktop:stage-sidecar
      - name: Reject incomplete native protocol on a production tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          apps/desktop/src-tauri/binaries/sanser-client-macos-aarch64-apple-darwin --capabilities-json | jq -e --arg version "$SANSER_VERSION" '.nativeSnv2 == true and .groupVoiceImplementation == true and .groupVoiceFloatingControls == true and .externalVoiceGate == true and .version == $version'
          apps/desktop/src-tauri/binaries/sanser-host-macos-aarch64-apple-darwin --capabilities-json | jq -e --arg version "$SANSER_VERSION" '.nativeSnv2 == true and .groupVoiceImplementation == true and .groupVoiceFloatingControls == true and .externalVoiceGate == true and .version == $version'
      - name: Build application and DMG
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$APPLE_CERTIFICATE" ]]; then
            if [[ "$APPLE_SIGNING_IDENTITY" != "Developer ID Application: "* || -z "$APPLE_CERTIFICATE_PASSWORD" ]]; then
              echo '::error::Configure a Developer ID Application identity and certificate password together with APPLE_CERTIFICATE.'
              exit 1
            fi
          else
            if [[ -n "$APPLE_SIGNING_IDENTITY" || -n "$APPLE_CERTIFICATE_PASSWORD" ]]; then
              echo '::error::Apple signing configuration is incomplete; APPLE_CERTIFICATE is required.'
              exit 1
            fi
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
            if [[ -n "$MACOS_SELF_SIGNED_CERTIFICATE" ]]; then
              if [[ -z "$MACOS_SELF_SIGNED_CERTIFICATE_PASSWORD" || -n "$APPLE_ID" || -n "$APPLE_PASSWORD" || -n "$APPLE_TEAM_ID" ]]; then
                echo '::error::Self-signed Mac signing needs its certificate password and cannot be notarized.'
                exit 1
              fi
              # A self-signed identity is not a "valid" identity for Tauri's own
              # certificate import. Keep it in a job-local keychain on the search
              # list and name it by fingerprint; codesign needs no trust setting.
              keychain="$RUNNER_TEMP/sanser-signing.keychain-db"
              keychain_password="$(openssl rand -hex 24)"
              printf '%s' "$MACOS_SELF_SIGNED_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/sanser-signing.p12"
              security create-keychain -p "$keychain_password" "$keychain"
              security set-keychain-settings "$keychain"
              security unlock-keychain -p "$keychain_password" "$keychain"
              security import "$RUNNER_TEMP/sanser-signing.p12" -k "$keychain" -P "$MACOS_SELF_SIGNED_CERTIFICATE_PASSWORD" -T /usr/bin/codesign > /dev/null
              rm -f "$RUNNER_TEMP/sanser-signing.p12"
              security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
              security list-keychains -d user | sed 's/^ *"//;s/"$//' | { cat; echo "$keychain"; } | tr '\n' '\0' | xargs -0 security list-keychains -d user -s
              fingerprint="$(security find-certificate -a -Z "$keychain" | awk '/^SHA-1 hash:/ {print $3; exit}')"
              test -n "$fingerprint"
              export APPLE_SIGNING_IDENTITY="$fingerprint"
              echo "SANSER_SIGNING_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"
              echo '::warning::Self-signed Mac build: stable permission identity, but not notarized; Gatekeeper still warns on first open.'
            else
              export APPLE_SIGNING_IDENTITY=-
              echo '::warning::Ad-hoc Mac build: Screen Recording permission may need to be removed and granted again after an update.'
            fi
          fi
          if [[ -n "$APPLE_ID" || -n "$APPLE_PASSWORD" || -n "$APPLE_TEAM_ID" ]]; then
            if [[ -z "$APPLE_ID" || -z "$APPLE_PASSWORD" || -z "$APPLE_TEAM_ID" || "$APPLE_SIGNING_IDENTITY" == - ]]; then
              echo '::error::Notarization requires Developer ID signing plus APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID.'
              exit 1
            fi
          else
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          npm --workspace @sanser/desktop run tauri -- build --target aarch64-apple-darwin
        env:
          # Tauri imports the certificate into a temporary keychain. Never print it.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_SELF_SIGNED_CERTIFICATE: ${{ secrets.MACOS_SELF_SIGNED_CERTIFICATE }}
          MACOS_SELF_SIGNED_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SELF_SIGNED_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify stable self-signed identity
        if: env.SANSER_SIGNING_FINGERPRINT != ''
        shell: bash
        run: |
          set -euo pipefail
          app="$(find /tmp/sanser-target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          codesign --verify --deep --strict "$app"
          # The permission identity must be the certificate, never a per-build cdhash.
          expected="identifier \"com.sanser.desktop\" and certificate leaf = H\"$(printf '%s' "$SANSER_SIGNING_FINGERPRINT" | tr 'A-F' 'a-f')\""
          actual="$(codesign -d -r- "$app" 2>&1 | sed -n 's/^designated => //p')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Unexpected Mac code requirement: $actual"
            exit 1
          fi
      - name: Name artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          bundle_dir="/tmp/sanser-target/aarch64-apple-darwin/release/bundle/macos"
          app="$(find "$bundle_dir" -maxdepth 1 -name '*.app' -print -quit)"
          dmg="$(find /tmp/sanser-target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          updater="$(find "$bundle_dir" -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
          test -n "$app" && test -n "$dmg" && test -n "$updater" && test -f "$updater.sig"
          cp "$dmg" artifacts/Sanser-macOS-2.3.8-arm64.dmg
          ditto -c -k --sequesterRsrc --keepParent "$app" artifacts/Sanser-macOS-2.3.8-arm64.zip
          cp "$updater" artifacts/Sanser-macOS-2.3.8-arm64.app.tar.gz
          cp "$updater.sig" artifacts/Sanser-macOS-2.3.8-arm64.app.tar.gz.sig
      - uses: actions/upload-artifact@v4
        with:
          name: sanser-macos-2.3.8-arm64
          path: artifacts/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: [windows-x64, macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: sanser-*
          path: artifacts
          merge-multiple: true
      - name: Generate signed updater manifest
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/generate-updater-manifest.mjs artifacts
      - working-directory: artifacts
        run: sha256sum Sanser-* updater-latest.json > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "Sanser 2.3.8" --notes-file docs/releases/v2.3.8.md
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest=true
