name: Release Sanser 2.0.0

on:
  push:
    tags: ["v2.0.0"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SANSER_VERSION: 2.0.0

jobs:
  source-check:
    name: Release source policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-repository.sh
      - name: Require the release tag
        if: github.event_name == 'push'
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v${SANSER_VERSION}"

  windows-x64:
    name: Windows x64
    needs: source-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build native host
        shell: pwsh
        run: |
          cmake -S native/host-windows -B build/host-windows -A x64
          cmake --build build/host-windows --config Release --parallel
      - name: Require a real SNV2 engine for tagged releases
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $capabilities = (& build/host-windows/Release/sanser-host-windows.exe --capabilities-json) | ConvertFrom-Json
          if ($capabilities.nativeSnv2 -ne $true) { throw 'nativeSnv2 is not implemented; refusing a production tag' }
      - name: Build server sidecar
        run: cargo build -p sanser-server --release --target x86_64-pc-windows-msvc
      - name: Stage Tauri sidecars
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/binaries | Out-Null
          Copy-Item build/host-windows/Release/sanser-host-windows.exe apps/desktop/src-tauri/binaries/sanser-host-windows-x86_64-pc-windows-msvc.exe
          Copy-Item target/x86_64-pc-windows-msvc/release/sanser-server.exe apps/desktop/src-tauri/binaries/sanser-server-x86_64-pc-windows-msvc.exe
      - name: Build Tauri and NSIS
        run: npm --workspace @sanser/desktop run tauri -- build --target x86_64-pc-windows-msvc
      - name: Assemble named release artifacts
        shell: pwsh
        run: |
          $artifact = New-Item -ItemType Directory -Force artifacts/windows
          $portable = New-Item -ItemType Directory -Force build/portable
          Copy-Item target/x86_64-pc-windows-msvc/release/sanser.exe $portable/sanser.exe
          Copy-Item build/host-windows/Release/sanser-host-windows.exe $portable/sanser-host-windows.exe
          Copy-Item target/x86_64-pc-windows-msvc/release/sanser-server.exe $portable/sanser-server.exe
          7z a -t7z -mx=9 build/sanser-portable.7z ./build/portable/*
          @'
          ;!@Install@!UTF-8!
          Title="Sanser 2.0.0 Portable"
          RunProgram="sanser.exe"
          GUIMode="2"
          ;!@InstallEnd@!
          '@ | Set-Content -NoNewline -Encoding utf8 build/sfx-config.txt
          $sfx = Join-Path $env:ProgramFiles '7-Zip/7z.sfx'
          cmd /c copy /b `"$sfx`"+build\sfx-config.txt+build\sanser-portable.7z `"artifacts\windows\Sanser-Windows-2.0.0-x64-portable.exe`"
          $setup = Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw 'NSIS installer was not produced' }
          Copy-Item $setup.FullName artifacts/windows/Sanser-Windows-2.0.0-x64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: sanser-windows-2.0.0-x64
          path: artifacts/windows/*
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64
    needs: source-check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build native client
        run: |
          cmake -S native/client-macos -B build/client-macos -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build/client-macos --config Release --parallel
      - name: Require a real SNV2 engine for tagged releases
        if: github.event_name == 'push'
        shell: bash
        run: build/client-macos/sanser-client-macos --capabilities-json | jq -e '.nativeSnv2 == true'
      - name: Build server sidecar
        run: cargo build -p sanser-server --release --target aarch64-apple-darwin
      - name: Stage Tauri sidecars
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          cp build/client-macos/sanser-client-macos apps/desktop/src-tauri/binaries/sanser-client-macos-aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/sanser-server apps/desktop/src-tauri/binaries/sanser-server-aarch64-apple-darwin
      - name: Build Tauri application and DMG
        run: npm --workspace @sanser/desktop run tauri -- build --target aarch64-apple-darwin
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      - name: Assemble named release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/macos
          app="$(find target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          dmg="$(find target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$app" && test -n "$dmg"
          cp "$dmg" artifacts/macos/Sanser-macOS-2.0.0-arm64.dmg
          ditto -c -k --sequesterRsrc --keepParent "$app" artifacts/macos/Sanser-macOS-2.0.0-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sanser-macos-2.0.0-arm64
          path: artifacts/macos/*
          if-no-files-found: error

  publish:
    name: Checksums and GitHub release
    needs: [windows-x64, macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sanser-*
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        working-directory: artifacts
        shell: bash
        run: sha256sum Sanser-* > SHA256SUMS.txt
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" != v* ]]; then tag="v${SANSER_VERSION}"; fi
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Sanser ${SANSER_VERSION}" --generate-notes
          gh release upload "$tag" artifacts/* --clobber
