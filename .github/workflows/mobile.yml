name: Mobile Flutter
on:
  push:
    branches: [Version-2.0.0, main]
    paths: ['apps/mobile/**', 'native/mobile/**', 'native/desktop/**', 'native/protocol/**', 'native/common/**', 'scripts/*mobile-ios*', 'scripts/build-mobile-p2p.sh', 'crates/sanser-mobile-p2p/**', 'crates/sanser-p2p/**', 'Cargo.lock', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['apps/mobile/**', 'native/mobile/**', 'native/desktop/**', 'native/protocol/**', 'native/common/**', 'scripts/*mobile-ios*', 'scripts/build-mobile-p2p.sh', 'crates/sanser-mobile-p2p/**', 'crates/sanser-p2p/**', 'Cargo.lock', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android
          components: clippy,rustfmt
      - name: Check mobile Direct interoperability and cancellation
        run: |
          cargo test --locked -p sanser-mobile-p2p
          cargo clippy --locked -p sanser-mobile-p2p --all-targets -- -D warnings
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = abaf9c523780a608bd46686fd5e53740a07077f8
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile
      - run: flutter build apk --debug --target-platform android-arm64
        working-directory: apps/mobile
      - run: ./gradlew :app:testDebugUnitTest
        working-directory: apps/mobile/android
      - name: Build unsigned Release APK for local signing
        working-directory: apps/mobile
        run: |
          test ! -e android/key.properties
          flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: sanser-mobile-android-release-unsigned
          path: apps/mobile/build/app/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sanser-mobile-android-preview-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        sdk: [iphonesimulator, iphoneos]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = abaf9c523780a608bd46686fd5e53740a07077f8
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - if: matrix.sdk == 'iphonesimulator'
        run: ./scripts/build-mobile-ios.sh iphonesimulator
      - name: Verify newest-image presentation with real H.264
        if: matrix.sdk == 'iphoneos'
        run: bash scripts/test-mobile-video-ios.sh
      - name: Inspect native archive
        if: matrix.sdk == 'iphonesimulator'
        run: |
          file apps/mobile/ios/Native/iphonesimulator/libSanserMobile.a
          nm -gU apps/mobile/ios/Native/iphonesimulator/libSanserMobile.a | grep sanser_mobile_
      - name: Build iOS Simulator
        if: matrix.sdk == 'iphonesimulator'
        working-directory: apps/mobile
        run: |
          if ! flutter build ios --simulator --debug --no-codesign -v > "$RUNNER_TEMP/sanser-mobile-ios.log" 2>&1; then
            tail -n 220 "$RUNNER_TEMP/sanser-mobile-ios.log"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-mobile-build-diagnostics-${{ matrix.sdk }}
          path: |
            ${{ runner.temp }}/sanser-mobile-ios.log
            apps/mobile/ios/Native/iphonesimulator/libSanserMobile.a
            apps/mobile/ios/Flutter/*.xcconfig
            apps/mobile/ios/Runner.xcodeproj/project.pbxproj
      - name: Package unsigned Simulator app
        if: matrix.sdk == 'iphonesimulator'
        run: |
          mkdir -p artifacts
          ditto -c -k --keepParent apps/mobile/build/ios/iphonesimulator/Runner.app artifacts/Sanser-iOS-2.3.7-simulator-unsigned.zip
      - uses: actions/upload-artifact@v4
        if: matrix.sdk == 'iphonesimulator'
        with:
          name: sanser-mobile-ios-simulator-unsigned
          path: artifacts/Sanser-iOS-2.3.7-simulator-unsigned.zip
      - name: Build release iPhone IPA for recipient re-signing
        if: matrix.sdk == 'iphoneos'
        env:
          FLUTTER_BIN: ${{ runner.temp }}/flutter/bin/flutter
        run: bash scripts/build-mobile-ios-device.sh
      - uses: actions/upload-artifact@v4
        if: matrix.sdk == 'iphoneos'
        with:
          name: sanser-mobile-ios-device-unsigned
          path: |
            artifacts/mobile-2.3.7/*.ipa
            artifacts/mobile-2.3.7/*.ipa.sha256
            artifacts/mobile-2.3.7/*.ipa.json
