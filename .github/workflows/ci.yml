name: CI

on:
  pull_request:
  push:
    branches: [main, Version-2.0.0]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-repository.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:check
      - run: npm run desktop:lint
      - run: npm run desktop:test
      - run: npm run desktop:build
      - run: npm audit --omit=dev --audit-level=moderate

  native-protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S native/protocol -B build/snv2 -DBUILD_TESTING=ON
      - run: cmake --build build/snv2 --config Release --parallel
      - run: ctest --test-dir build/snv2 -C Release --output-on-failure

  macos-client:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S native/client-macos -B build/client-macos -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/client-macos --config Release --parallel
      - run: ./build/client-macos/sanser-client-macos --capabilities-json

  windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S native/host-windows -B build/host-windows -A x64
      - run: cmake --build build/host-windows --config Release --parallel
