name: Release Sanser Mobile

# The phone apps have their own version (apps/mobile/pubspec.yaml) and are
# released only when they change: tag mobile-vX.Y.Z. Desktop releases (vX.Y.Z)
# do not rebuild them.
on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.read.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-repository.sh
      - id: read
        shell: bash
        run: |
          version="$(sed -n 's/^version: \([0-9][0-9.]*\)+.*/\1/p' apps/mobile/pubspec.yaml)"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "mobile-v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the phone app version $version"
            exit 1
          fi
          echo "mobile=$version" >> "$GITHUB_OUTPUT"

  android-arm64:
    # Signed with the project's own release key from repository secrets
    # (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
    # ANDROID_KEY_PASSWORD). Without them no APK is attached; the release
    # still publishes.
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      MOBILE_VERSION: ${{ needs.version.outputs.mobile }}
    steps:
      - name: Check the Android release key
        id: key
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Android release key secrets are not set; no APK is attached to this release."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4
      - if: steps.key.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: steps.key.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android
      - name: Install pinned Flutter
        if: steps.key.outputs.present == 'true'
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = abaf9c523780a608bd46686fd5e53740a07077f8
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build signed Android APK
        if: steps.key.outputs.present == 'true'
        working-directory: apps/mobile
        shell: bash
        run: |
          umask 077
          keystore="$RUNNER_TEMP/sanser-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > android/key.properties
          flutter pub get --enforce-lockfile
          flutter build apk --release --target-platform android-arm64
          rm -f android/key.properties "$keystore"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/artifacts/Sanser-Android-$MOBILE_VERSION-arm64.apk"
      - if: steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sanser-android-${{ needs.version.outputs.mobile }}-arm64
          path: artifacts/*

  ios-device:
    # Unsigned: install with your own Apple ID (Sideloadly, AltStore) or
    # re-sign with your team. Apple does not allow unsigned direct installs.
    needs: version
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = abaf9c523780a608bd46686fd5e53740a07077f8
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - name: Build unsigned iPhone IPA
        env:
          FLUTTER_BIN: ${{ runner.temp }}/flutter/bin/flutter
        run: |
          bash scripts/build-mobile-ios-device.sh "$GITHUB_WORKSPACE/artifacts"
      - uses: actions/upload-artifact@v4
        with:
          name: sanser-ios-${{ needs.version.outputs.mobile }}-device-unsigned
          path: artifacts/Sanser-iOS-*-device-unsigned.ipa

  publish:
    needs: [version, android-arm64, ios-device]
    runs-on: ubuntu-latest
    env:
      MOBILE_VERSION: ${{ needs.version.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sanser-*
          path: artifacts
          merge-multiple: true
      - working-directory: artifacts
        run: sha256sum Sanser-* > SHA256SUMS-mobile.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes="docs/releases/mobile-v$MOBILE_VERSION.md"
          [[ -f "$notes" ]] || notes="docs/releases/v$MOBILE_VERSION.md"
          tag="mobile-v$MOBILE_VERSION"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --title "Sanser Mobile $MOBILE_VERSION" --notes-file "$notes"
          gh release upload "$tag" artifacts/* --clobber
          # Never "latest": the desktop updater reads the latest release.
          gh release edit "$tag" --draft=false --prerelease=false --latest=false
      - name: Refresh website download links
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref Version-2.0.0
