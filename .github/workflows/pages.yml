name: Website (GitHub Pages)

on:
  push:
    branches: [main, Version-2.0.0]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
      - "scripts/website-release-links.py"
  # release.yml starts this after publishing, so new versions reach the site.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Package site (exclude README)
        run: |
          mkdir -p _site
          rsync -a --exclude README.md website/ _site/
      - name: Bake newest release links into the site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/website-release-links.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
